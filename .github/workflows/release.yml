# Builds the native addon for every supported platform, packs the npm tarball
# with all of them inside, checks the tarball installs and runs on each
# platform, and (for v* tags) publishes it with provenance.
#
# Run it by hand (Actions > Release > Run workflow) to get the tarball as an
# artifact without publishing. Tick "publish-dry-run" to also run the publish
# job with `npm publish --dry-run` and print the identity npm will check.
#
# The jobs are the shared workflows in kodespire/compression-js; WORKFLOWS.md
# there documents the inputs. npm trusted publishing checks this file's name
# (release.yml), not the shared workflow's.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish-dry-run:
        description: Run the publish job with npm publish --dry-run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wasm:
    uses: kodespire/compression-js/.github/workflows/build-wasm.yml@v1
    with:
      wasm-build: node scripts/build-wasm.mjs
      wasm-artifact-path: out/wasm

  prebuild:
    uses: kodespire/compression-js/.github/workflows/prebuild.yml@v1

  release:
    needs: [wasm, prebuild]
    uses: kodespire/compression-js/.github/workflows/pack-verify-publish.yml@v1
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    with:
      wasm-artifact-path: out/wasm
      tarball-prefix: kodespire-zstd-js
      smoke-script: test/smoke/smoke.mjs
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      publish-dry-run: ${{ inputs.publish-dry-run == true }}
