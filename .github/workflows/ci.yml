# The jobs are the shared workflows in kodespire/compression-js; WORKFLOWS.md
# there documents the inputs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    uses: kodespire/compression-js/.github/workflows/build-wasm.yml@v1
    with:
      wasm-build: node scripts/build-wasm.mjs
      wasm-artifact-path: out/wasm

  node:
    needs: wasm
    uses: kodespire/compression-js/.github/workflows/test-node.yml@v1
    with:
      wasm-artifact-path: out/wasm
      cli-build: node scripts/build-zstd-cli.mjs

  browsers:
    needs: wasm
    uses: kodespire/compression-js/.github/workflows/test-browsers.yml@v1
    with:
      wasm-artifact-path: out/wasm

  runtimes:
    needs: wasm
    uses: kodespire/compression-js/.github/workflows/test-runtimes.yml@v1
    with:
      wasm-artifact-path: out/wasm
      tarball-prefix: kodespire-zstd-js
      smoke-script: test/smoke/smoke.mjs
      backend-env: ZSTD_JS_BACKEND
